[package]
name = "dynws"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Glitchyi"]
description = "Build focused multi-repository workspaces with symlinks and Git worktrees"
license = "MIT"
repository = "https://github.com/Glitchyi/dynws"
homepage = "https://github.com/Glitchyi/dynws"
readme = "README.md"
keywords = ["workspace", "git", "worktree", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
default-run = "dws"
autobins = false
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[[bin]]
name = "dws"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
